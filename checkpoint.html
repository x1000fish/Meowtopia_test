<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200">
  <title>Meowtopia - Learning Checkpoint</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Gaegu:wght@700&family=Titan+One&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bungee+Shade&family=Shrikhand&family=Alfa+Slab+One&display=swap" rel="stylesheet">
  <style>
    :root {
      --pink: #FFB7C5;
      --green: #99C44D;
      --dark: #463438;
      --cream: #FFF9F0;
      --blue: #5BA4CF;
      --purple: #B583E5;
      --gold: #FFB800;
      --gray-light: #F3F4F6;
      --gray-dark: #9CA3AF;
    }

    * { box-sizing: border-box; }

    body, button, select, textarea, input, p, span, div {
      font-family: Arial;
    }
    h1, .checkpoint-title {
      font-family: 'Titan One', cursive !important;
      letter-spacing: 1px;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--cream);
      background-image: linear-gradient(45deg, #fce4ec 25%, transparent 25%, transparent 50%, #fce4ec 50%, #fce4ec 75%, transparent 75%, transparent);
      background-size: 80px 80px;
      color: var(--dark);
      line-height: 1.6;
    }

    .page-shell {
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px 60px;
    }

    .checkpoint-shell {
      width: min(1080px, 100%);
      background: rgba(255, 255, 255, 0.98);
      border: 5px solid var(--dark);
      border-radius: 28px;
      box-shadow: 12px 12px 0 var(--pink);
      padding: 36px;
    }

    .header-section {
      border-bottom: 4px dashed #E5E7EB;
      padding-bottom: 20px;
      margin-bottom: 28px;
      width: 100%;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .checkpoint-label {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--green);
      color: white;
      border: 3px solid var(--dark);
      border-radius: 999px;
      padding: 8px 20px;
      font-size: 1.1rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 4px 0 var(--dark);
    }

    .checkpoint-title {
      font-family: 'Titan One', cursive !important;
      font-size: 2.8rem;
      font-weight: 900;
      color: white;
      -webkit-text-stroke: 2px var(--dark);
      text-shadow: 3px 3px 0 var(--blue);
      margin-top: 12px;
      margin-bottom: 0;
      letter-spacing: 2px;
    }

    .star-meter {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: bold;
      font-size: 1rem;
      color: var(--dark);
      background: #F9FAFB;
      padding: 6px 18px; /* 縮小上下內距，使其與左側綠色長條等高 */
      border-radius: 999px;
      border: 3px solid var(--dark);
      box-shadow: 0 4px 0 var(--dark);
      height: 48px; /* 強制固定高度與左側綠色標籤相符 */
      box-sizing: border-box;
    }

    .star-meter span {
      font-size: 1.6rem; /* 稍微縮小星星大小以完美融入高度 */
      color: var(--gold);
      letter-spacing: 2px;
      text-shadow: 1px 1px 0 var(--dark);
      transform: translateY(1px);
    }

    .scene-grid {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 32px;
      align-items: start;
    }

    .intro-panel,
    .question-panel,
    .reward-panel {
      border: 4px solid var(--dark);
      border-radius: 20px;
      background: white;
      padding: 32px;
      box-shadow: 6px 6px 0 rgba(70, 52, 56, 0.1);
    }
    /* 彈跳視窗遮罩與內容樣式 */
    .reward-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(70, 52, 56, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      padding: 24px;
    }
    .reward-modal-overlay.show {
      display: flex;
      animation: fadeIn 0.3s ease-out;
    }
    /* 彈跳視窗內容樣式調整 */
    .reward-modal-content {
      background: #FFF7D7;
      border: 8px solid var(--dark);
      border-radius: 36px;
      padding: 36px;
      text-align: center;
      width: min(480px, 100%); /* 稍微加寬視窗以容納單行標題 */
      box-shadow: 12px 12px 0 var(--gold);
      transform: scale(0.8);
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    
    /* 確保標題強制在同一行並自動縮放 */
    #reward-title {
      font-size: 1.9rem !important;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--dark);
      font-weight: 900;
      margin-bottom: 10px;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes popIn {
      to { transform: scale(1); }
    }

    .intro-panel {
      background: linear-gradient(145deg, #ffffff, #F9FAFB);
    }

    .intro-panel h2 {
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--dark);
      margin: 0 0 16px;
      border-bottom: 4px solid var(--pink);
      padding-bottom: 12px;
      display: block;
    }

    .intro-panel p {
      font-size: 1.1rem;
      line-height: 1.8;
      color: #374151;
      margin: 0 0 20px;
    }

    .concept-path { display: grid; gap: 12px; }

    .concept-chip {
      display: grid;
      grid-template-columns: 140px 1fr; /* 固定左側標題寬度為 140px，右側說明自動填滿，確保上下完全對齊 */
      align-items: center;
      gap: 12px;
      border: 2px solid #E5E7EB;
      border-radius: 12px;
      padding: 14px 18px;
      background: white;
      font-size: 1.05rem;
      transition: border-color 0.2s;
    }
    .concept-chip:hover { border-color: var(--blue); }
    .concept-chip span { color: #6B7280; font-weight: bold; text-align: left; }
    .concept-chip strong { color: var(--blue); font-weight: 900; font-size: 1.05rem; text-align: left; }

    .step-header {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 2px dashed #E5E7EB;
    }
    
    .step-progress {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    
    .step-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--gray-light);
      border: 2px solid var(--gray-dark);
      transition: all 0.3s;
      cursor: pointer;
      padding: 0;
    }
    .step-dot:hover {
      border-color: var(--dark);
      transform: scale(1.15);
    }
    .step-dot.active {
      background: var(--gold);
      border-color: var(--dark);
      transform: scale(1.3);
    }
    .step-dot.done {
      background: var(--green);
      border-color: var(--dark);
    }
    .step-dot:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .question-block {
      display: none;
      animation: fadeInRight 0.4s ease forwards;
    }
    .question-block.active {
      display: block;
    }

    @keyframes fadeInRight {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .question-panel h3 {
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--dark);
      margin: 0 0 20px;
      line-height: 1.5;
    }

    .visual-board {
      min-height: 200px;
      border: 3px solid #E5E7EB;
      border-radius: 16px;
      background: white;
      position: relative;
      overflow: hidden;
      margin-bottom: 28px;
    }

    .checkpoint-board {
      min-height: 250px;
      border: 6px solid var(--dark);
      border-radius: 32px;
      background: #fffaf5;
      box-shadow: 8px 8px 0 var(--pink);
      position: relative;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .checkpoint-node {
      width: 140px;
      height: 140px;
      background: white;
      border: 6px solid var(--dark);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: absolute;
      box-shadow: 3px 3px 0 var(--dark);
      z-index: 20;
      transition: background 0.3s ease;
    }
    .checkpoint-node.node-correct { background: #ebceff; }
    .checkpoint-node img {
      width: 98px;
      height: auto;
      pointer-events: none;
      transform: scale(1.05) translateY(-5px) translateX(-2px);
    }

    .checkpoint-line {
      position: absolute;
      background: var(--dark);
      cursor: pointer;
      z-index: 10;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .checkpoint-line:hover,
    .checkpoint-line.line-highlight {
      background: var(--green) !important;
      box-shadow: 0 0 15px rgba(153, 196, 77, 0.8) !important;
      z-index: 16 !important;
    }
    .checkpoint-line::after {
      content: '';
      position: absolute;
      top: -15px;
      bottom: -15px;
      left: -15px;
      right: -15px;
      background: transparent;
    }

    .checkpoint-fish {
      width: 60px;
      height: 60px;
      position: absolute;
      z-index: 30;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translate(-50%, -50%);
      transition: top 0.5s cubic-bezier(0.16, 1, 0.3, 1), left 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .checkpoint-fish img {
      width: 75px;
      height: auto;
      transform: scale(1.05) translateY(-8px);
    }

    .level1-board .checkpoint-line { height: 8px; top: 50%; left: 140px; right: 140px; transform: translateY(-50%); }
    .level1-board .node-left { top: 50%; left: 30px; transform: translateY(-50%); }
    .level1-board .node-right { top: 50%; right: 30px; transform: translateY(-50%); }
    .level1-board .slot-left { top: 58%; left: 95px; }
    .level1-board .slot-right { top: 58%; left: calc(100% - 105px); }
   
    /* 調整 Checkpoint 2 的外層容器間距，使其與 Checkpoint 1 的題目與框框距離完全一致 */
    .cp2-lab {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 0px; /* 統一與上方問題文字的距離 */
      margin-bottom: 0px;
    }
    
    /* 將按鈕容器的位置整體往上移 */
   .cp2-board.cp2-board-custom .path-controls {
      position: absolute;
      bottom: 20px; /* 貼近底部，減少空白 */
      left: 24px;
      right: 24px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      z-index: 40;
    }
    .path-btn, .multi-toggle-btn {
      min-height: 40px !important;
      height: 40px;
      padding: 0 4px;
      font-size: 0.8rem !important;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      white-space: nowrap;
      border: 3px solid var(--dark);
      border-radius: 10px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--dark);
      transition: all 0.1s ease;
    }

    .path-btn {
      background: white;
      color: var(--dark);
    }
    .path-btn:hover {
      transform: translateY(-2px);
      background: #F0F9FF;
      box-shadow: 0 5px 0 var(--dark);
    }

    .multi-toggle-btn.mode-4 { background: #b583e5; color: white; text-shadow: 1px 1px 0 var(--dark); }
    .multi-toggle-btn.mode-8 { background: #46c89d; color: white; text-shadow: 1px 1px 0 var(--dark); }
    .multi-toggle-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 0 var(--dark);
    }
    .cp2-board {
      min-height: 320px;
      margin-bottom: 0;
    }
    
    
    /* Checkpoint 2 專屬：拉寬正方形尺寸，並將上方節點位置整體往上移以預留下方按鈕空間 */
  /* 保持外框大小維持不變 */
    .cp2-board.cp2-board-custom {
      min-height: 400px !important;
      width: 480px !important;
      max-width: 100%;
      margin: 0 auto 24px auto;
      position: relative;
    }
    
    /* 獨立放大 Checkpoint 2 的 Node 尺寸（不影響其他 Checkpoint） */
    .cp2-board.cp2-board-custom .checkpoint-node {
      width: 110px !important;
      height: 110px !important;
    }
    .cp2-board.cp2-board-custom .checkpoint-node img {
      width: 82px !important;
    }

    /* 調整內部節點拉開距離（位置擴大到外框邊緣） */
    .cp2-board.cp2-board-custom .cp2-node-0 { top: 25px !important; left: 60px !important; }
    .cp2-board.cp2-board-custom .cp2-node-1 { top: 25px !important; right: 60px !important; left: auto !important; }
    .cp2-board.cp2-board-custom .cp2-node-2 { bottom: 75px !important; left: 60px !important; top: auto !important; }
    .cp2-board.cp2-board-custom .cp2-node-3 { bottom: 75px !important; right: 60px !important; left: auto !important; top: auto !important; }

    /* 調整魚的位置跟著節點距離擴開 */
    .cp2-board.cp2-board-custom .cp2-slot-0 { top: 95px !important; left: 115px !important; }
    .cp2-board.cp2-board-custom .cp2-slot-1 { top: 95px !important; left: calc(100% - 115px) !important; }
    .cp2-board.cp2-board-custom .cp2-slot-2 { top: calc(100% - 115px) !important; left: 115px !important; }
    .cp2-board.cp2-board-custom .cp2-slot-3 { top: calc(100% - 115px) !important; left: calc(100% - 115px) !important; }

    /* 調整內部連線長度以對齊拉開後的節點 */
    .cp2-board.cp2-board-custom #cp2-line-h-0 { top: 78px !important; left: 145px !important; right: 145px !important; width: auto !important; }
    .cp2-board.cp2-board-custom #cp2-line-h-1 { bottom: 118px !important; left: 145px !important; right: 145px !important; width: auto !important; top: auto !important; }
    
    .cp2-board.cp2-board-custom #cp2-line-v-0 { left: 108px !important; top: 85px !important; bottom: 175px !important; height: auto !important; }
    .cp2-board.cp2-board-custom #cp2-line-v-1 { right: 108px !important; left: auto !important; top: 85px !important; bottom: 175px !important; height: auto !important; }

    .cp2-board .checkpoint-node {
      width: 96px;
      height: 96px;
      border-width: 5px;
    }
    .cp2-board .checkpoint-node img {
      width: 74px;
      transform: scale(1.02) translateY(-4px) translateX(-1px);
    }
    .cp2-board .fixed-number {
      position: absolute;
      bottom: 0px;
      right: 40px; /* 數值從原本的 31px 調大，標籤就會往左移 */
      font-size: 16px;
      font-weight: 900;
      color: var(--dark);
      pointer-events: none;
      z-index: 25;
    }
    .cp2-board .checkpoint-fish {
      width: 62px;
      height: 62px;
    }
    .cp2-board .checkpoint-fish img { width: 58px; }
    .cp2-node-0 { top: 30px; left: 62px; }
    .cp2-node-1 { top: 30px; right: 62px; }
    .cp2-node-2 { bottom: 30px; left: 62px; }
    .cp2-node-3 { bottom: 30px; right: 62px; }
    .cp2-slot-0 { top: 106px; left: 110px; }
    .cp2-slot-1 { top: 106px; left: calc(100% - 110px); }
    .cp2-slot-2 { top: calc(100% - 63px); left: 110px; }
    .cp2-slot-3 { top: calc(100% - 63px); left: calc(100% - 110px); }
    .cp2-line-h {
      height: 8px;
      left: 155px;
      right: 155px;
    }
    .cp2-line-v {
      width: 8px;
      top: 110px;
      bottom: 110px;
    }
    #cp2-line-h-0 { top: 78px; }
    #cp2-line-h-1 { bottom: 78px; }
    #cp2-line-v-0 { left: 110px; }
    #cp2-line-v-1 { right: 110px; }

    .feedback {
      display: none;
      margin-top: 14px;
      border: 2px solid #E5E7EB;
      border-radius: 14px;
      padding: 14px 16px;
      font-weight: bold;
      line-height: 1.6;
    }
    .feedback.show { display: block; }
    .feedback.correct {
      background: #F0FDF4;
      border-color: var(--green);
      color: #276749;
    }
    .feedback.wrong {
      background: #FFF7ED;
      border-color: var(--gold);
      color: #7C2D12;
    }

    .answer-btn:disabled,
    .feature-btn:disabled,
    .match-row select:disabled {
      cursor: default;
      transform: none;
    }
    .answer-btn.locked:not(.selected),
    .feature-btn.locked:not(.selected) {
      opacity: 0.5;
    }
    .answer-btn.locked.selected,
    .feature-btn.locked.selected {
      opacity: 1;
    }

    .cp3-board {
      height: 420px;
      margin-bottom: 26px;
    }
    .cp3-line {
      position: absolute;
      height: 4px;
      background: var(--dark);
      transform-origin: 0 50%;
      border-radius: 999px;
      opacity: 0.9;
      z-index: 4;
    }
    .cp3-line.dashed {
      height: 0;
      background: transparent;
      border-top: 4px dashed var(--dark);
      opacity: 0.45;
    }
    .cp3-line.horizontal { background: #629eed; }
    .cp3-line.vertical { background: #99C44D; }
    .cp3-line.diagonal { background: #b583e5; }
    .cp3-line.dashed { border-top-color: #463438; }
    .cp3-mini-node {
      width: 58px;
      height: 58px;
      border: 4px solid var(--dark);
      border-radius: 50%;
      background: #ebceff;
      box-shadow: 2px 2px 0 var(--dark);
      position: absolute;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cp3-mini-node img {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }
    .cp3-mini-node .cp3-fish-mini {
      width: 24px;
      height: 24px;
      position: absolute;
      left: 50%;
      bottom: 3px;
      transform: translateX(-50%);
      filter: drop-shadow(0 1px 0 white);
      z-index: 12;
    }
    .cp3-mini-node.far-copy img {
      filter: grayscale(1) saturate(0.35) brightness(0.98);
    }

    .line-question-row {
      display: grid;
      grid-template-columns: 150px 1fr;
      gap: 16px;
      align-items: center;
      font-weight: bold;
      font-size: 1.05rem;
      background: #F9FAFB;
      padding: 16px;
      border-radius: 16px;
      border: 2px solid #E5E7EB;
    }
    .line-question-label {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--dark);
    }
    .line-question-row .feature-options { margin-top: 0; }
    .line-question-row .feature-btn { min-height: 70px; border-width: 2px; }
    .line-legend {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: -8px 0 22px;
      font-weight: 900;
      color: var(--dark);
    }
    .line-legend span {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.95rem;
    }
    .legend-stroke {
      width: 34px;
      height: 5px;
      border-radius: 999px;
      background: var(--dark);
      display: inline-block;
    }
    .legend-stroke.horizontal { background: #629eed; }
    .legend-stroke.vertical { background: #99C44D; transform: rotate(90deg); }
    .legend-stroke.diagonal { background: #b583e5; transform: rotate(-35deg); }
    .legend-stroke.dashed { height: 0; border-top: 4px dashed var(--dark); background: transparent; }

    .mini-node {
      width: 90px;
      height: 90px;
      border: 3px solid var(--dark);
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      position: absolute;
      z-index: 2;
    }

    .mini-node img { max-width: 60px; max-height: 60px; object-fit: contain; }
    .mini-label { display: none; }

    .edge-line {
      position: absolute;
      height: 4px;
      background: var(--dark);
      z-index: 1;
    }
    .edge-line.vertical { width: 4px; height: 140px; }

    .toggle-demo {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0; 
      padding: 40px 20px;
    }

    .toggle-demo .mini-node { position: relative; inset: auto; margin: 0; }

    .toggle-edge {
      width: 120px;
      height: 6px;
      background: var(--dark);
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
      z-index: 1;
      border-radius: 4px;
    }
    .toggle-edge::after {
      content: '';
      position: absolute;
      top: -20px; bottom: -20px; left: 0; right: 0;
    }
    .toggle-edge:hover { background: var(--blue); transform: scaleY(1.5); }
    .toggle-edge.active {
      background: var(--purple);
      box-shadow: 0 0 0 6px rgba(181, 131, 229, 0.25);
    }

    .fish-dot {
      width: 50px;
      height: 50px;
      position: absolute;
      top: 50%;
      left: calc(50% - 105px); 
      transform: translate(-50%, -50%);
      transition: left 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      z-index: 5;
    }
    .fish-dot.right { left: calc(50% + 105px); }
    .fish-dot img { width: 100%; height: 100%; object-fit: contain; }

    .hypercube-2bit { height: 320px; }
    .hypercube-2bit .node-00 { left: 80px; top: 45px; }
    .hypercube-2bit .node-01 { right: 80px; top: 45px; }
    .hypercube-2bit .node-10 { left: 80px; bottom: 45px; }
    .hypercube-2bit .node-11 { right: 80px; bottom: 45px; }
    .hypercube-2bit .edge-top { left: 125px; top: 88px; width: calc(100% - 250px); }
    .hypercube-2bit .edge-bottom { left: 125px; bottom: 88px; width: calc(100% - 250px); }
    .hypercube-2bit .edge-left { left: 123px; top: 90px; height: calc(100% - 180px); width: 4px; }
    .hypercube-2bit .edge-right { right: 123px; top: 90px; height: calc(100% - 180px); width: 4px; }

    .option-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin: 16px 0;
    }

    .answer-btn, .feature-btn {
      min-height: 64px;
      border: 3px solid #E5E7EB;
      border-radius: 12px;
      background: white;
      color: #374151;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .answer-btn:hover, .feature-btn:hover {
      border-color: var(--blue);
      background: #F0F9FF;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(91, 164, 207, 0.15);
    }

    .answer-btn.selected, .feature-btn.selected {
      background: var(--gold);
      color: var(--dark);
      border-color: var(--dark);
      box-shadow: 0 4px 0 var(--dark);
      transform: translateY(-2px);
    }

    .feature-options {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-top: 14px;
    }

    .feature-btn {
      min-height: 100px;
      flex-direction: column;
      gap: 8px;
    }
    .feature-btn img { width: 48px; height: 48px; object-fit: contain; }
    .feature-btn small { font-size: 0.9rem; color: #6B7280; }
    .feature-btn.selected small { color: var(--dark); }

    .matching-grid { display: grid; gap: 16px; margin-top: 16px; }

    .match-feature-row {
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 16px;
      align-items: center;
      font-weight: bold;
      font-size: 1.05rem;
      background: #F9FAFB;
      padding: 16px;
      border-radius: 16px;
      border: 2px solid #E5E7EB;
    }

    .match-feature-row .feature-options { margin-top: 0; }
    .match-feature-row .feature-btn { min-height: 70px; border-width: 2px; }

    .match-row {
      display: grid;
      grid-template-columns: 100px 1fr;
      gap: 16px;
      align-items: center;
      font-weight: bold;
    }

    .match-row select, .reflection-input {
      width: 100%;
      border: 2px solid #D1D5DB;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 1.05rem;
      background: white;
      outline: none;
      transition: border-color 0.2s;
    }
    .match-row select:focus, .reflection-input:focus { border-color: var(--blue); }

    .reflection-input { min-height: 120px; resize: vertical; }

    .dimension-strip {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    .dimension-card {
      border: 2px solid #E5E7EB;
      border-radius: 16px;
      background: white;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      font-weight: bold;
      color: #4B5563;
    }
    .dimension-card img { width: 56px; height: 56px; object-fit: contain; }

    .step-comparison {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin: 20px 0;
    }

    .step-box {
      border: 2px solid #E5E7EB;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      background: #F9FAFB;
      font-weight: bold;
      color: #6B7280;
    }

    .step-box strong {
      display: block;
      font-size: 3.5rem;
      color: var(--blue);
      line-height: 1;
      margin: 12px 0;
    }

    .reward-panel {
      display: none;
      text-align: center;
      margin-top: 32px;
      background: #FFFAF0;
      border-color: var(--gold);
    }
    .reward-panel.show { display: block; animation: slideUp 0.4s ease-out; }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .reward-star {
      font-size: 6rem;
      color: var(--gold);
      text-shadow: 4px 4px 0 var(--dark);
      animation: starPop 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      margin: 10px 0 20px;
    }

    @keyframes starPop {
      0% { transform: scale(0.2) rotate(-30deg); opacity: 0; }
      50% { transform: scale(1.2) rotate(10deg); }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }

    .game-btn {
      cursor: pointer;
      border: 5px solid var(--dark);
      border-radius: 60px;
      padding: 12px 24px;
      font-size: 20px;
      font-weight: 900;
      color: white;
      text-shadow: 2px 2px 0 var(--dark);
      box-shadow: 0 6px 0 var(--dark);
      position: relative;
      transition: transform 0.15s, box-shadow 0.15s, top 0.1s;
      text-align: center;
      text-decoration: none;
      display: inline-block;
    }
    .game-btn:hover {
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 10px 0 var(--dark);
    }
    .game-btn:active {
      top: 4px;
      box-shadow: 0 2px 0 var(--dark);
      transform: translateY(0);
    }
    .game-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: 0 6px 0 var(--dark) !important;
      top: 0;
      filter: grayscale(0.5);
    }
    .btn-blue { background: var(--blue); }
    .btn-green { background: var(--green); }
    .btn-red { background: var(--pink); }
    .actions {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      margin-top: 32px;
      padding-top: 32px;
      border-top: 3px dashed #E5E7EB;
    }

    .status-line {
      min-height: 30px;
      margin-top: 16px;
      font-weight: bold;
      color: var(--blue);
      text-align: center;
    }

    .certificate { text-align: center; display: none; }
    .certificate.show { display: block; animation: slideUp 0.5s ease; }

    .certificate-box {
      border: 5px solid var(--dark);
      border-radius: 28px;
      background: linear-gradient(135deg, #FFFAF0, #FFF3C4);
      padding: 48px;
      box-shadow: 12px 12px 0 var(--green);
      margin: 0 auto 36px;
      max-width: 700px;
    }

    .certificate h2 {
      color: var(--dark);
      font-size: 3rem;
      font-weight: 900;
      margin: 0 0 24px;
    }

    .certificate-list {
      display: grid;
      gap: 16px;
      max-width: 400px;
      margin: 0 auto;
      text-align: left;
      font-size: 1.2rem;
      font-weight: bold;
      background: white;
      padding: 32px;
      border-radius: 20px;
      border: 3px solid #E5E7EB;
    }
    
    .certificate-list div { display: flex; align-items: center; gap: 12px; }
    .certificate-list div::before {
      content: '★';
      color: var(--green);
      font-size: 1.4rem;
    }

    @media (max-width: 900px) {
      .scene-grid { grid-template-columns: 1fr; }
      .header-top { flex-direction: column; align-items: stretch; text-align: center; gap: 10px; }
      .checkpoint-label, .star-meter { justify-content: center; }
      .feature-options, .dimension-strip { grid-template-columns: repeat(2, 1fr); }
      .cp2-lab { grid-template-columns: 1fr; }
      .path-controls { grid-template-columns: repeat(3, 1fr); }
      .line-question-row { grid-template-columns: 1fr; }
      .actions { flex-direction: column; }
    }
    /* 讓 NEXT 按鈕長得跟選項（.answer-btn）一樣，但寬度撐滿 */
    .step-next-btn {
      width: 100%;
      min-height: 64px;
      border: 3px solid #E5E7EB;
      border-radius: 12px;
      background: white;
      color: var(--blue);
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px;
    }
    .step-next-btn:hover {
      border-color: var(--blue);
      background: #F0F9FF;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(91, 164, 207, 0.15);
    }
  </style>
</head>
<body>
  <main class="page-shell">
    <section id="checkpoint-shell" class="checkpoint-shell">
     <div class="header-section">
        <div class="header-top">
          <div id="checkpoint-label" class="checkpoint-label">Checkpoint 1</div>
          <div class="star-meter">
            Quantum Stars
            <span id="star-meter">☆☆☆☆</span>
          </div>
        </div>
      </div>

      <div id="checkpoint-content">
        <div class="scene-grid">
          <aside class="intro-panel">
            <h2 id="intro-title"></h2>
            <p id="intro-copy"></p>
            <div id="concept-path" class="concept-path"></div>
          </aside>
          
          <section id="question-area" class="question-panel">
          </section>
        </div>
        
      <!-- 獎勵彈跳視窗 -->
      <div id="reward-modal" class="reward-modal-overlay">
        <div class="reward-modal-content">
          <div class="reward-star">★</div>
           <h2 id="reward-title"></h2>
          <p id="reward-copy" style="font-size: 1.1rem; margin: 0 0 24px; color: #4B5563; font-weight: bold;"></p>
      
      <!-- 排版對齊 Level 1 的按鈕結構 -->
          
          <div style="display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center; width: 100%;">
            <button onclick="location.href='index.html'" class="game-btn btn-blue" style="width: 100%; border-radius: 60px; display: inline-flex; align-items: center; justify-content: center; white-space: nowrap; font-size: 22px; padding: 12px;">HOME</button>
        
            <div style="display: flex; gap: 14px; align-items: center; justify-content: center; width: 100%;">
              <button onclick="location.reload()" class="game-btn btn-green" style="width: 78px; height: 78px; min-width: 78px; border-radius: 50%; padding: 0; display: inline-flex; align-items: center; justify-content: center; margin: 0; box-sizing: border-box;" aria-label="Play again" title="Play again">
                  <svg viewBox="0 0 24 24" aria-hidden="true" fill="#fff" style="width: 38px; height: 38px; filter: drop-shadow(2px 2px 0 #463438);">
                      <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4C7.58 4 4 7.58 4 12s3.58 8 8 8c3.73 0 6.84-2.55 7.73-6h-3.06c-.77 1.76-2.54 3-4.67 3c-2.76 0-5-2.24-5-5s2.24-5 5-5c1.38 0 2.63.56 3.54 1.46L12 12h8V4z" />
                  </svg>
              </button>
              <button id="reward-next" class="game-btn btn-green" style="flex-grow: 1; white-space: nowrap; font-size: 22px; padding: 12px 24px;">KEEP GOING</button>
            </div>
          </div>
         </div>
       </div>
        <div class="actions">
         <button onclick="location.href='index.html'" class="game-btn btn-blue">HOME</button>
          <button id="complete-btn" class="game-btn btn-green" disabled>CLAIM STAR</button>
        </div>
        <div id="status-line" class="status-line"></div>
      </div>

      <div id="certificate-content" class="certificate">
        <div class="certificate-box">
          <h2>Quantum Explorer Certificate</h2>
          <div class="reward-star">★</div>
          <div class="certificate-list">
            <div>State Exploration</div>
            <div>Hypercube Discovery</div>
            <div>Dimension Expansion</div>
            <div>Circuit Optimization</div>
          </div>
        </div>
        <button onclick="location.href='index.html'" class="game-btn btn-blue">HOME</button>
      </div>
    </section>
  </main>

  <script>
    const CHECKPOINT_SCRIPT_URL = '';
    const SKIN_STORAGE_KEY = 'meowtopiaSkin';
    const STAR_KEYS = ['cp1', 'cp2', 'cp3'];
    const STAR_NAMES = {
      cp1: 'State Explorer Star',
      cp2: 'Geometry Explorer Star',
      cp3: 'World Explorer Star',
      cp4: 'Quantum Explorer Certificate'
    };
    
    const CHECKPOINTS = {
      cp1: {
        title: 'Checkpoint 1', star: STAR_NAMES.cp1, next: 'level2.html',
        introTitle: 'State Explorer',
        intro: '🎉 Great job!\nYou solved your first puzzle.\nNow let\'s slow down for a moment and think about what you discovered.\nThese questions are here to help you discover the hidden rules of this world.',
        concepts: [['Cat Node', 'Target state'], ['Fish', 'Current state'], ['Edge', 'Possible move']],
        stepsCount: 3
      },
      cp2: {
        title: 'Checkpoint 2', star: STAR_NAMES.cp2, next: 'level5.html',
        introTitle: 'Geometry Explorer',
        intro: '🎉 Great job!\nYou completed the 2-feature puzzles.\nNow let\'s slow down and look at how this puzzle is organized.The cats are not placed randomly.Each connection follows a hidden pattern.These questions will help you discover how different directions represent different feature changes.',
        concepts: [['State', 'A combination of features'], ['Direction', 'A path where the same feature changes'], ['Feature Mapping', 'Different directions represent different feature changes'], ['Advanced Move', 'Applying the same move to multiple states at once']],
        stepsCount: 3
      },
      cp3: {
        title: 'Checkpoint 3', star: STAR_NAMES.cp3, next: 'level18.html', // 導向通關 Level 18 解鎖 CP4
        introTitle: 'World Explorer',
        intro: '🎉 Great job!\nYou explored the 4-feature puzzles.\nNow let\'s slow down and think about how this world grows.\nAs more features are added, the puzzle becomes larger, but the same rules still work.\nThere are also many ways to solve the same puzzle.\nThese questions will help you discover how larger worlds are built and how to find better solutions.',
        concepts: [['New Feature', 'A feature that creates more possible states'], ['Larger World', 'A world created by adding more features'], ['Efficient Solution', 'Reaching the same target using fewer moves'], ['Optimization', 'Finding a better solution to the same puzzle']],
        stepsCount: 4
      },
      cp4: {
        title: 'Final Challenge', star: STAR_NAMES.cp4, next: 'checkpoint.html?certificate=1',
        introTitle: 'Quantum Explorer Certificate',
        intro: '🎉 Congratulations!\nYou have completed the Quantum Explorer journey.\nThis final challenge reviews what you discovered about:\n- states and features\n- state transformations\n- reversible operations\n- expanding puzzle worlds\n- efficient solutions\nScore 85% or higher to earn your Quantum Explorer Certificate.',
        concepts: [['Part 1', 'Quantum Concept Assessment (10 questions)'], ['Part 2', 'Player Reflection (4 questions)'], ['Passing Score', '85% or higher to earn certificate']],
        stepsCount: 14
      }
    };

    const state = {
      checkpointId: 'cp1',
      answers: {},
      startedAt: Date.now(),
      attempts: 0,
      toggleClicks: 0,
      demoFishRight: false,
      mistakes: {},
      cp1FishAtNode: [0, 1],
      cp2FishAtNode: [0, 1, 2, 3],
      currentStep: 1,
      totalSteps: 2
    };

    function getUser() { return sessionStorage.getItem('currentUser') || localStorage.getItem('currentUser') || 'Guest'; }
    function getStarsKey() { return `meow_checkpoint_stars_${getUser()}`; }
    function defaultStars() { return { cp1: false, cp2: false, cp3: false, cp4: false }; }
    function readStars() {
      try { return { ...defaultStars(), ...JSON.parse(localStorage.getItem(getStarsKey()) || sessionStorage.getItem('checkpointStars') || '{}') }; }
      catch { return defaultStars(); }
    }
    function writeStars(stars) {
      const normalized = { ...defaultStars(), ...stars };
      localStorage.setItem(getStarsKey(), JSON.stringify(normalized));
      sessionStorage.setItem('checkpointStars', JSON.stringify(normalized));
    }
    function updateStarMeter() {
      const stars = readStars();
      document.getElementById('star-meter').innerText = STAR_KEYS.map(id => stars[id] ? '★' : '☆').join('');
    }

    function currentSkin() {
      const skin = sessionStorage.getItem(SKIN_STORAGE_KEY) || 'default';
      return ['default', 'rip', 'poto', 'mj'].includes(skin) ? skin : 'default';
    }
    function featureImageIndex(index) {
      return Math.max(0, 3 - Number(index));
    }
    function featureSrc(index) {
      const imageIndex = featureImageIndex(index);
      const skin = currentSkin();
      if (skin === 'rip') return `./RIP/dif${imageIndex}.png`;
      if (skin === 'poto') return `./poto/dif${imageIndex}.png`;
      if (skin === 'mj') return `./mj/dif${imageIndex}.png`;
      return `./svg/dif${imageIndex}.png`;
    }
    function codeFor(index, bits = 1) { return index.toString(2).padStart(Math.max(bits, 3), '0'); }
    function defaultCatSrc(index, bits = 1) { return `./svg/${codeFor(index, bits)}-c.svg`; }
    function defaultFishSrc(index, bits = 1) { return `./svg/${codeFor(index, bits)}-f.svg`; }
    function catSrc(index, bits = 1) {
      const skin = currentSkin();
      if (skin === 'rip') return `./RIP/Cat${index + 1}.png`;
      if (skin === 'poto') return `./poto/cat${index}.png`;
      if (skin === 'mj') return `./mj/Cat${index}.png`;
      return defaultCatSrc(index, bits);
    }
    function fishSrc(index, bits = 1) {
      const skin = currentSkin();
      if (skin === 'rip') return `./RIP/Fish${index + 1}.png`;
      if (skin === 'poto') return `./poto/fish${index}.png`;
      if (skin === 'mj') return `./mj/Fish${index}.png`;
      return defaultFishSrc(index, bits);
    }

    // Step navigation
    function renderStepHeader(totalSteps) {
      let dots = Array.from({length: totalSteps}).map((_, i) => `
        <button class="step-dot" id="dot-${i+1}" type="button" onclick="goToStep(${i + 1})" aria-label="Question ${i + 1}"></button>
      `).join('');
      return `
        <div class="step-header">
          <div class="step-progress">${dots}</div>
        </div>
      `;
    }

    function stepQuestionIds(step) {
      const expected = expectedAnswers(state.checkpointId) || {};
      return Object.keys(expected).filter(key => QUESTION_STEPS[key] === step);
    }

    function isStepAnswered(step) {
      const ids = stepQuestionIds(step);
      return ids.length === 0 || ids.every(hasAnswer);
    }

    function canVisitStep(step) {
      if (step <= 1) return true;
      for (let i = 1; i < step; i++) {
        if (!isStepAnswered(i)) return false;
      }
      return true;
    }

    function updateStepUI() {
      document.querySelectorAll('.step-dot').forEach((dot, index) => {
        const step = index + 1;
        const active = step === state.currentStep;
        dot.classList.toggle('active', active);
        dot.classList.toggle('done', !active && isStepAnswered(step));
        dot.disabled = !canVisitStep(step);
      });
      document.querySelectorAll('.question-block').forEach(block => {
        block.classList.toggle('active', parseInt(block.dataset.step) === state.currentStep);
      });
      checkFinalCompletion();
    }

    function goToStep(step) {
      if (!canVisitStep(step)) return;
      state.currentStep = Math.max(1, Math.min(state.totalSteps, step));
      updateStepUI();
    }

    function nextStep() {
      if (state.currentStep < state.totalSteps) {
        state.currentStep++;
        updateStepUI();
        
        // 切換到下一題時，自動重置該題互動盤的魚與節點位置
        if (state.checkpointId === 'cp1' && cp1StepStates[state.currentStep]) {
          cp1StepStates[state.currentStep] = { fishAtNode: [0, 1], toggleClicks: 0 };
          updateCP1StepDemoUI(state.currentStep);
        }
        
        setTimeout(() => {
          const questionArea = document.getElementById('question-area') || document.getElementById('checkpoint-shell');
          if (questionArea) {
            questionArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
          }
        }, 50);
      }
    }

    function prevStep() {
      if (state.currentStep > 1) {
        state.currentStep--;
        updateStepUI();
      }
    }

    function selectAnswer(questionId, value) {
      if (hasAnswer(questionId)) return;
      state.answers[questionId] = value;
      document.querySelectorAll(`[data-question="${questionId}"]`).forEach(btn => {
        btn.classList.toggle('selected', btn.dataset.value === String(value));
      });
      document.getElementById('status-line').innerText = '';
      showQuestionFeedback(questionId, value);
      lockQuestion(questionId);
      checkFinalCompletion();
      updateStepUI();
    }

    function selectDropdownAnswer(questionId, value) {
      if (!value || hasAnswer(questionId)) return;
      state.answers[questionId] = value;
      showQuestionFeedback(questionId, value);
      lockQuestion(questionId);
      checkFinalCompletion();
      updateStepUI();
    }

    function lockQuestion(questionId) {
      document.querySelectorAll(`[data-question="${questionId}"]`).forEach(btn => {
        btn.disabled = true;
        btn.classList.add('locked');
      });
      const select = document.getElementById(questionId);
      if (select) select.disabled = true;
    }

    function hasAnswer(key) { return state.answers[key] !== undefined && state.answers[key] !== ''; }

    function checkFinalCompletion() {
      const btn = document.getElementById('complete-btn');
      if (!btn) return;
      const missing = missingRequired();
      const wrong = unresolvedMistakes();
      
      if (missing.length === 0) {
        btn.disabled = false;
        if (wrong.length > 0) {
          btn.innerText = 'RETRY MISSED';
          btn.onclick = startMistakeRetry; // 支援多輪循環答錯再複習
        } else {
          btn.innerText = 'CLAIM STAR';
          btn.onclick = completeCheckpoint;
        }
        btn.style.animation = 'starPop 0.5s ease forwards';
      } else {
        btn.disabled = true;
        btn.innerText = 'CLAIM STAR';
        btn.onclick = completeCheckpoint;
      }
    }

    function showQuestionFeedback(questionId, value) {
      const expected = expectedAnswers(state.checkpointId) || {};
      if (!Object.prototype.hasOwnProperty.call(expected, questionId)) return;
      const feedback = document.querySelector(`[data-feedback="${questionId}"]`);
      const isCorrect = String(value) === String(expected[questionId]);
      if (isCorrect) {
        delete state.mistakes[questionId];
      } else {
        state.mistakes[questionId] = true;
      }
      if (!feedback) return;
      const meta = QUESTION_META[questionId] || {};
      feedback.className = `feedback show ${isCorrect ? 'correct' : 'wrong'}`;

      // 刪除 The correct answer is... 提示，答錯時只顯示錯誤提示文字
      if (isCorrect) {
        feedback.innerHTML = `Correct.<br>${meta.explanation || ''}`;
      } else {
        const wrongText = meta.wrong || `Review this question carefully.`;
        feedback.innerHTML = `${wrongText}`;
      }

      if (isStepAnswered(state.currentStep) && state.currentStep < state.totalSteps) {
        const activeBlock = document.querySelector(`.question-block[data-step="${state.currentStep}"]`);
        if (activeBlock) {
          let nextContainer = activeBlock.querySelector('.step-next-container');
          if (!nextContainer) {

            nextContainer.className = 'step-next-container';
            nextContainer.style.display = 'flex';
            nextContainer.style.justifyContent = 'flex-end';
            nextContainer.style.marginTop = '24px';
            activeBlock.appendChild(nextContainer);
          }
          nextContainer.innerHTML = `<button onclick="nextStep()" class="step-next-btn">NEXT ➜</button>`;
        }
      }

      setTimeout(() => {
        const actionsArea = document.querySelector('.actions') || document.getElementById('complete-btn');
        if (actionsArea) {
          actionsArea.scrollIntoView({ behavior: 'smooth', block: 'end' });
        } else {

        }
      }, 100);

      return `<div class="feedback" data-feedback="${questionId}"></div>`;

    function unresolvedMistakes() {
      const expected = expectedAnswers(state.checkpointId) || {};
      const coreKeys = ['cp4_q1', 'cp4_q2', 'cp4_q3', 'cp4_q4', 'cp4_q5', 'cp4_q6', 'cp4_q7', 'cp4_q8', 'cp4_q9', 'cp4_q10'];
      
      if (state.checkpointId === 'cp4') {
        // 計算 Part 1 答對的題數
        let correctCount = coreKeys.filter(key => String(state.answers[key]) === String(expected[key])).length;
        
        // 如果未滿 9 題（未達 90 分），回傳錯誤狀態阻擋通關
        if (correctCount < 9) {
          return ['not_enough_score'];
        }
        return [];
      }
      
      return Object.keys(state.mistakes).filter(key => state.mistakes[key] && String(state.answers[key]) !== String(expected[key]));
    }
    function clearAnswerForRetry(questionId) {
      delete state.answers[questionId];
      delete state.mistakes[questionId];
      document.querySelectorAll(`[data-question="${questionId}"]`).forEach(btn => {
        btn.classList.remove('selected', 'locked');
        btn.disabled = false;
      });
      const select = document.getElementById(questionId);
      if (select) {
        select.value = '';
        select.disabled = false;
      }
      const feedback = document.querySelector(`[data-feedback="${questionId}"]`);
      if (feedback) {
        feedback.className = 'feedback';
        feedback.innerHTML = '';
      }
      // Remove any generated next buttons in the step block
      const step = QUESTION_STEPS[questionId];
      if (step) {
        const block = document.querySelector(`.question-block[data-step="${step}"]`);
        if (block) {
          const nextContainer = block.querySelector('.step-next-container');
          if (nextContainer) nextContainer.remove();
        }
      }
    }

    function startMistakeRetry() {
      const wrong = unresolvedMistakes();
      if (!wrong.length) return;
      
      // 只要按一次 RETRY MISSED，把所有答錯的題目與對應的互動盤節點全部一次重置
      wrong.forEach(questionId => {
        clearAnswerForRetry(questionId);
        const step = QUESTION_STEPS[questionId];
        if (step && state.checkpointId === 'cp1' && cp1StepStates[step]) {
          cp1StepStates[step] = { fishAtNode: [0, 1], toggleClicks: 0 };
          updateCP1StepDemoUI(step);
        }
      });

      // 自動跳轉到第一道錯題所在的步驟
      const first = wrong[0];
      const targetStep = QUESTION_STEPS[first] || 1;
      state.currentStep = targetStep;

      updateStepUI();
           
      setTimeout(() => {
        const questionArea = document.getElementById('question-area') || document.getElementById('checkpoint-shell');
        if (questionArea) {
          questionArea.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
      }, 50);
    }

    function cp3Board() {
      const scale = 0.68;
      const offsetX = 118;
      const offsetY = 215;
      const getPos = (i) => {
        let x = (i & 1) ? 120 : 0;
        let y = (i & 2) ? 120 : 0;
        if (i & 4) {
          x += (i & 1) ? 90 : -80;
          y += (i & 2) ? 80 : -80;
        }
        if (i & 8) {
          x += 400;
          y -= 80;
        }
        return { x: x * scale + offsetX, y: y * scale + offsetY };
      };
      const lineClass = ['horizontal', 'vertical', 'diagonal', 'dashed'];
      let html = '<div class="visual-board cp3-board">';
      for (let i = 0; i < 16; i++) {
        for (let edgeType = 0; edgeType < 4; edgeType++) {
          const j = i ^ (1 << edgeType);
          if (j <= i) continue;
          const p1 = getPos(i);
          const p2 = getPos(j);
          const len = Math.hypot(p2.x - p1.x, p2.y - p1.y);
          const angle = Math.atan2(p2.y - p1.y, p2.x - p1.x) * 180 / Math.PI;
          html += `<div class="cp3-line ${lineClass[edgeType]}" style="left:${p1.x}px; top:${p1.y}px; width:${len}px; transform:rotate(${angle}deg);"></div>`;
        }
      }
      for (let i = 0; i < 16; i++) {
        const p = getPos(i);
        const assetIndex = i & 7;
        html += `
          <div class="cp3-mini-node ${i >= 8 ? 'far-copy' : ''}" style="left:${p.x}px; top:${p.y}px; transform:translate(-50%, -50%);">
            <img src="${defaultCatSrc(assetIndex, 3)}" alt="cat state">
            <img class="cp3-fish-mini" src="${defaultFishSrc(assetIndex, 3)}" alt="fish state">
          </div>
        `;
      }
      html += '</div>';
      return html;
    }

          <p style="margin-bottom: 8px; font-weight: bold;">After playing this game, do you understand reversible operations better?</p>
          ${optionButtons('cp4_ref2', [
            {label:'Strongly agree', value:'0'},
            {label:'Agree', value:'1'},
            {label:'Neutral', value:'2'},
            {label:'Disagree / Strongly disagree', value:'3'}
          ])}
        </div>
        <div class="question-block" data-step="13">
          <h3>Part 2: Player Reflection (3/4)</h3>
          <p style="margin-bottom: 8px; font-weight: bold;">Which part helped you understand the concepts most?</p>
          ${optionButtons('cp4_ref3', [
            {label:'Cat features', value:'0'},
            {label:'Fish movement', value:'1'},
            {label:'Advanced moves', value:'2'},
            {label:'Short solutions / Other', value:'3'}
          ])}
        </div>
        <div class="question-block" data-step="14">
          <h3>Part 2: Player Reflection (4/4)</h3>
          <p style="margin-bottom: 8px; font-weight: bold;">What was your favorite part of this game?</p>
          <textarea class="reflection-input" placeholder="Type your thoughts here..." oninput="state.answers.cp4_ref4=this.value; checkFinalCompletion();"></textarea>
        </div>
      `;
      updateStepUI();
    }

    function expectedAnswers(id) {
      return {
        cp1: { cp1_q1: '1', cp1_q2: 'back', cp1_q3: 'move_state' },
        cp2: { cp2_horizontal: '0', cp2_vertical: '1', cp2_q2: '0' },
        cp3: { cp3_q1: '1', cp3_q2: '2', cp3_q3: '0', cp3_q4: '0' },
        cp4: {
          cp4_q1: '1', cp4_q2: '1', cp4_q3: '0', cp4_q4: '0',
          cp4_q5: '1', cp4_q6: '0', cp4_q7: '0', cp4_q8: '0', cp4_q9: '1', cp4_q10: '1'
        }
      }[id] || {};
    }

    function missingRequired() {
      const expected = expectedAnswers(state.checkpointId);
      const missing = Object.keys(expected).filter(key => !state.answers[key]);
      if (state.checkpointId === 'cp4') {
        if (!(state.answers.cp4_reflect_before || '').trim()) missing.push('cp4_reflect_before');
        if (!(state.answers.cp4_reflect_after || '').trim()) missing.push('cp4_reflect_after');
      }
      return missing;
    }

    async function completeCheckpoint() {
      state.attempts += 1;
      const missing = missingRequired();
      if (missing.length > 0) return;
      if (unresolvedMistakes().length > 0) {
        startMistakeRetry();
        return;
      }

      const cp = CHECKPOINTS[state.checkpointId];
      const stars = readStars();
      
      // 防呆機制：檢查這顆星星是否已經拿過了
      const alreadyCollected = stars[state.checkpointId];

      // 只有在還沒拿過的情況下才將該星星設為 true
      stars[state.checkpointId] = true;
      writeStars(stars);

      const nextLevel = { cp1: 2, cp2: 5, cp3: 11, cp4: 19 }[state.checkpointId];
      const curLvl = Math.max(parseInt(sessionStorage.getItem('currentLevel') || '1'), parseInt(sessionStorage.getItem('meow_level') || '1'));
      const upLvl = Math.max(curLvl, nextLevel);
      sessionStorage.setItem('currentLevel', String(upLvl));
      sessionStorage.setItem('meow_level', String(Math.min(upLvl, 18)));
      updateStarMeter();

      // 防呆提示：如果是重複過關，可以微調提示文字讓玩家知道已經通關過了（選填）
      if (alreadyCollected) {
        document.getElementById('reward-copy').innerText = 'You already collected this star, but great job reviewing!';
      } else {
        document.getElementById('reward-copy').innerText = 'You successfully converted your discoveries into learning progress!';
      }

      // 播放 meow 音檔
      try {
        meowAudio.currentTime = 0;
        meowAudio.play().catch(() => {});
      } catch (e) {}

      document.getElementById('reward-title').innerText = cp.star;
      document.getElementById('reward-modal').classList.add('show');
      document.getElementById('complete-btn').style.display = 'none';
      document.getElementById('status-line').innerText = '';
    }
    const QUESTION_STEPS = {
      cp1_q1: 1, cp1_q2: 2, cp1_q3: 3,
      cp2_horizontal: 1, cp2_vertical: 2, cp2_q2: 3,
      cp3_q1: 1, cp3_q2: 2, cp3_q3: 3, cp3_q4: 4,
      cp4_q1: 1, cp4_q2: 2, cp4_q3: 3, cp4_q4: 4, cp4_q5: 5, cp4_q6: 6, cp4_q7: 7, cp4_q8: 8, cp4_q9: 9, cp4_q10: 10,
      cp4_ref1: 11, cp4_ref2: 12, cp4_ref3: 13, cp4_ref4: 14
    };
    const QUESTION_META = {
      cp1_q1: {
        label: '1',
        explanation: 'Great observation! Connected cats differ by exactly <img src="./svg/dif3.png" alt="dif" style="width:25px; display:inline-block; vertical-align:middle; margin:0 4px;" />. Every move along an edge changes exactly one feature.',
        wrong: 'Look carefully at the features of both cats. Compare them one by one. When two cats are connected, only one feature changes.'
      },
      cp1_q2: {
        label: 'The fish returns to its original position.',
        explanation: 'Exactly! The first click changes the fish\'s position, and the second click brings it back. This type of move is called a reversible operation. It can return the fish to its original state.',
        wrong: 'Try clicking the same edge twice and watch carefully. The fish does not disappear or keep moving forever. It returns to its original position.'
      },
      cp1_q3: {
        label: 'B. A possible move that changes one state into another.',
        explanation: 'The line represents a possible move between two states. When you click an edge, the fish moves from one state to another.',
        wrong: 'Look at what happens when you click the line. The line allows the fish to move from one cat to another. It represents a move between states, not just a distance or decoration.'
      },
      cp2_horizontal: {
        label: '<img src="./svg/dif3.png" alt="Feature 1" style="width:25px; display:inline-block; vertical-align:middle;" /> changes',
        explanation: 'Great observation! Compare several cats connected by horizontal lines. You will find that only <img src="./svg/dif3.png" alt="Feature 1" style="width:25px; display:inline-block; vertical-align:middle; margin:0 4px;" /> changes, while the other feature stays the same. This means the horizontal direction represents changes in <img src="./svg/dif3.png" alt="Feature 1" style="width:25px; display:inline-block; vertical-align:middle; margin:0 4px;" />.',
        wrong: 'Look at several horizontal connections. Compare the cats at both ends of each line. Which feature changes every time in this direction?'
      },
      cp2_vertical: {
        label: '<img src="./svg/dif2.png" alt="Feature 2" style="width:25px; display:inline-block; vertical-align:middle;" /> changes',
        explanation: 'Exactly! Compare several cats connected by vertical lines. Only <img src="./svg/dif2.png" alt="Feature 2" style="width:25px; display:inline-block; vertical-align:middle; margin:0 4px;" /> changes, while the other feature stays the same. This means the vertical direction represents changes in <img src="./svg/dif2.png" alt="Feature 2" style="width:25px; display:inline-block; vertical-align:middle; margin:0 4px;" />.',
        wrong: 'Look at several vertical connections. Compare the cats at both ends of each line. Which feature changes every time in this direction?'
      },
      cp2_q2: {
        label: 'It applies the same move to multiple connected states at the same time.',
        explanation: 'Correct! An Advanced Move applies the same move to several connected states together. Instead of repeating the same move many times, it can solve the puzzle with fewer moves.',
        wrong: 'Watch what happens after using an Advanced Move. The puzzle rules do not change. Think about how many states are affected by one move.'
      },
      cp3_q1: {
        label: 'B. Copy the existing world and connect matching states using the new feature.',
        explanation: 'Correct! The original world stays the same. A new feature creates another copy of the world, and matching states are connected together. This allows the world to grow while keeping the same rules.',
        wrong: 'Think about how the puzzle becomes larger. Does the old world disappear, or is it used to build the new one?'
      },
      cp3_q2: {
        label: 'C. 32',
        explanation: 'Exactly! Each new feature doubles the number of possible states. With five features: 2 × 2 × 2 × 2 × 2 = 32. More features create more possible states.',
        wrong: 'Think about what happens every time a new feature is added. How does the number of possible states change?'
      },
      cp3_q3: {
        label: 'The fish reaches the target using fewer moves.',
        explanation: 'Great observation! Both players reached exactly the same target. Player B found a way to solve the puzzle using fewer moves. This is a more efficient solution.',
        wrong: 'Compare the two solutions carefully. Both players solved the same puzzle. Think about what is different between their solutions.'
      },
      cp3_q4: {
        label: 'A. To reach the same target using fewer moves.',
        explanation: 'Exactly! The goal stays the same. Instead of changing the puzzle, we try to find a shorter way to reach the same target. Finding a better way to solve the same puzzle is called optimization.',
        wrong: 'Think about what changes when a solution becomes better. The puzzle is the same. The target is the same. Only the path becomes more efficient.'
      },
     cp4_q1: { label: 'B. A state with features', explanation: 'Great observation! Each cat represents a state. A state is described by its combination of features.', wrong: 'Look carefully at the cats. Compare their features and think about what makes each cat different.' },
      cp4_q2: { label: 'B. One feature', explanation: 'Exactly! Connected cats differ by only one feature. Each move changes one part of the state.', wrong: 'Look at the two connected cats again. Compare their features one by one.' },
      cp4_q3: { label: 'A. A possible state change', explanation: 'Correct! A connection represents a possible transformation. The fish can move from one state to another.', wrong: 'Watch the fish when it moves. Think about what changes after following the connection.' },
      cp4_q4: { label: 'A. It goes back again', explanation: 'Exactly! A reversible operation can undo itself. The state returns to its original form.', wrong: 'Try repeating the same operation. Observe what happens after the second move.' },
      cp4_q5: { label: 'B. It connects new states', explanation: 'Great observation! A new feature expands the existing world. The original structure stays, and new states are added.', wrong: 'Think about how new levels are created. Look at what happens when a new feature appears.' },
      cp4_q6: { label: 'A. The basic rules', explanation: 'Correct! More features create a larger world. However, the same transformation rules still apply.', wrong: 'Compare puzzles with different numbers of features. Notice what changes and what stays the same.' },
      cp4_q7: { label: 'A. It changes many states together', explanation: 'Exactly! An Advanced Move applies a related operation to multiple states at once. This can reduce the number of moves.', wrong: 'Look carefully at the result after using an Advanced Move. Compare it with a normal move.' },
      cp4_q8: { label: 'A. A sequence of operations', explanation: 'Correct! Each move represents an operation. Together, the moves describe how the state changes.', wrong: 'Look back at your solution path. Think about what each move represents.' },
      cp4_q9: { label: 'B. Player B', explanation: 'Great! Both solutions reach the same goal. The solution with fewer moves uses fewer operations.', wrong: 'Compare the two solutions carefully. Think about what is different between them.' },
      cp4_q10: { label: 'B. A circuit problem', explanation: 'Congratulations! You discovered the hidden idea of the puzzle world. The game combines states, transformations, reversible operations, and efficient solutions which are important in quantum reversible circuits.', wrong: 'Think about everything you explored in the game. What ideas did you use to solve the puzzles?' }
    };
    // 宣告 pop 音檔（與 Level 1 位置相同）
    const popAudio = new Audio('pop.m4a');
    const meowAudio = new Audio('meow.m4a');

    function playPop() {
      popAudio.currentTime = 0;
      popAudio.play().catch(() => {});
    }

    // 全域監聽點擊事件，只要點到按鈕、選項、進度點等互動元素就會自動發出 pop 聲音
    document.addEventListener('click', event => {
      if (event.target.closest('button, .answer-btn, .feature-btn, .step-dot, .toggle-edge, .checkpoint-line')) {
        playPop();
      }
    }, true);

    function init() {
      const params = new URLSearchParams(location.search);
      state.checkpointId = params.get('id') || 'cp1';
      updateStarMeter();

      if (params.get('certificate') === '1') {
        if (STAR_KEYS.every(key => readStars()[key])) {
          document.getElementById('checkpoint-content').style.display = 'none';
          document.getElementById('certificate-content').classList.add('show');
          document.getElementById('checkpoint-label').innerText = 'Certificate';
          document.getElementById('checkpoint-title').innerText = 'Quantum Explorer Certificate';
        } else location.href = 'checkpoint.html?id=cp4';
        return;
      }

      if (!CHECKPOINTS[state.checkpointId]) state.checkpointId = 'cp1';
      const cp = CHECKPOINTS[state.checkpointId];
      renderIntro(cp);
      if (state.checkpointId === 'cp1') renderCP1();
      if (state.checkpointId === 'cp2') renderCP2();
      if (state.checkpointId === 'cp3') renderCP3();
      if (state.checkpointId === 'cp4') renderCP4();

      document.getElementById('complete-btn').onclick = completeCheckpoint;
      document.getElementById('reward-next').onclick = () => location.href = cp.next;
    }

    init();
  </script>
